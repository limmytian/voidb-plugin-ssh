[package]
name = "voidb-plugin-ssh"
version = "0.3.4"
edition = "2024"
license = "Apache-2.0"
authors = ["limmytian <limmytian@gmail.com>"]
description = "Standalone VoidB process plugin for SSH and SFTP"
repository = "https://github.com/limmytian/voidb-plugin-ssh"

[[bin]]
name = "voidb-plugin-ssh"
path = "src/main.rs"

[dependencies]
voidb-process-plugin-sdk = { git = "https://github.com/limmytian/voidb.git", rev = "31d22cd09c9b10f1d22f59d47e789a49c33a290d" }
voidb-core = { git = "https://github.com/limmytian/voidb.git", rev = "31d22cd09c9b10f1d22f59d47e789a49c33a290d" }
russh = "0.48"
russh-keys = "0.48"
russh-sftp = "2.1"
ssh-key = "0.6"
async-trait = "0.1"
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tokio = { version = "1.43", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["serde", "v4"] }
ratatui = "0.29"
crossterm = "0.28"
vt100 = "0.15"
clap = { version = "4.5", features = ["derive"] }
rpassword = "7"

[dev-dependencies]
toml = "0.8"
